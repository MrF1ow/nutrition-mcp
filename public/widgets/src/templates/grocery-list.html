<!doctype html>
<!--
  Grocery list widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  One card (`.panel`): a header, then store → section → line. Already-have tags
  sit on the line. Checking a box calls check_grocery_line when the host
  advertised serverTools; it does not put the item in the fridge.

  Data arrives as the `structuredContent` of list_grocery_lines; the shared
  bridge reads it across host conventions and calls render(). Standalone preview
  uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Grocery</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            .store {
                font-size: 12.5px;
                font-weight: 800;
            }
            .section {
                font-size: 10.5px;
                font-weight: 700;
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin: 6px 0 4px;
            }
            .line {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 4px 0;
                font-size: 12.5px;
            }
            .line.done .name {
                color: var(--text-dim);
                text-decoration: line-through;
            }
            .name {
                flex: 1 1 auto;
                min-width: 0;
            }
            .qty {
                font-variant-numeric: tabular-nums;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .tag {
                font-size: 10px;
                font-weight: 700;
                color: var(--accent);
                background: color-mix(in srgb, var(--accent) 12%, transparent);
                border-radius: 999px;
                padding: 1px 7px;
                white-space: nowrap;
            }
            .chk {
                margin-top: 2px;
                accent-color: var(--accent);
            }
            .chk[disabled] {
                opacity: 0.45;
            }
        </style>
    </head>
    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            const SAMPLE = {
                locale: "en",
                stores: [
                    {
                        id: "st-1",
                        name: "Safeway",
                        sections: [
                            {
                                id: "sec-dairy",
                                name: "Dairy",
                                lines: [
                                    {
                                        id: "ln-1",
                                        store_id: "st-1",
                                        section_id: "sec-dairy",
                                        display_name: "Milk",
                                        amount: 1,
                                        unit: "l",
                                        checked: false,
                                        already_have:
                                            "already have: have 0.5 l, need 0.5 l",
                                    },
                                    {
                                        id: "ln-2",
                                        store_id: "st-1",
                                        section_id: "sec-dairy",
                                        display_name: "Cottage Cheese",
                                        amount: 400,
                                        unit: "g",
                                        checked: true,
                                        already_have: "already have",
                                    },
                                ],
                            },
                            {
                                id: "sec-produce",
                                name: "Produce",
                                lines: [
                                    {
                                        id: "ln-3",
                                        store_id: "st-1",
                                        section_id: "sec-produce",
                                        display_name: "Bananas",
                                        amount: 6,
                                        unit: "each",
                                        checked: false,
                                        already_have: null,
                                    },
                                ],
                            },
                        ],
                    },
                ],
            };

            let __widgetApi = null;
            let __data = null;

            function esc(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function tpl(template, vars) {
                return String(template).replace(/\{(\w+)\}/g, (_, k) =>
                    vars[k] == null ? "" : String(vars[k]),
                );
            }

            function setLocaleFrom(data, api) {
                setLocale(
                    pickLocale(
                        data && data.locale,
                        api && api.hostContext && api.hostContext.locale,
                    ),
                );
            }

            function lineCount(stores) {
                let n = 0;
                for (const store of stores || []) {
                    for (const section of store.sections || []) {
                        n += (section.lines || []).length;
                    }
                }
                return n;
            }

            function render(data) {
                const root = document.getElementById("root");
                if (!data || !Array.isArray(data.stores)) {
                    root.innerHTML = "";
                    return;
                }
                __data = data;
                setLocaleFrom(data, __widgetApi);
                const canCheck = !!(__widgetApi && __widgetApi.canCallTools);
                const n = lineCount(data.stores);
                if (n === 0) {
                    root.innerHTML = `
          <div class="panel">
            <div class="phead"><div class="ptitle">${esc(T.groceryList.title)}</div></div>
            <div class="empty">${esc(T.groceryList.empty)}</div>
          </div>`;
                    return;
                }
                const stores = data.stores
                    .map((store) => {
                        const sections = (store.sections || [])
                            .filter((s) => (s.lines || []).length)
                            .map((section) => {
                                const rows = (section.lines || [])
                                    .map((line) => {
                                        const checked = !!line.checked;
                                        const tag = line.already_have
                                            ? `<span class="tag">${esc(line.already_have)}</span>`
                                            : "";
                                        const aria = tpl(
                                            checked
                                                ? T.groceryList.uncheckAria
                                                : T.groceryList.checkAria,
                                            { name: line.display_name },
                                        );
                                        const box = `<input class="chk" type="checkbox" data-id="${esc(line.id)}" ${checked ? "checked" : ""} ${canCheck ? "" : "disabled"} aria-label="${esc(aria)}" />`;
                                        return `<div class="line${checked ? " done" : ""}">${box}<span class="name">${esc(line.display_name)}</span><span class="qty">${esc(line.amount)} ${esc(line.unit)}</span>${tag}</div>`;
                                    })
                                    .join("");
                                return `<div class="section">${esc(section.name)}</div>${rows}`;
                            })
                            .join("");
                        if (!sections) return "";
                        return `<div class="psec"><div class="store">${esc(store.name)}</div>${sections}</div>`;
                    })
                    .join("");
                root.innerHTML = `
          <div class="panel">
            <div class="phead"><div class="ptitle">${esc(T.groceryList.title)}</div></div>
            ${stores}
          </div>`;
                if (!canCheck) return;
                root.querySelectorAll("input.chk").forEach((el) => {
                    el.addEventListener("change", async () => {
                        const id = el.getAttribute("data-id");
                        const checked = !!el.checked;
                        if (!id || !__widgetApi) return;
                        try {
                            await __widgetApi.callTool("check_grocery_line", {
                                id,
                                checked,
                            });
                            for (const store of __data.stores || []) {
                                for (const section of store.sections || []) {
                                    for (const line of section.lines || []) {
                                        if (line.id === id)
                                            line.checked = checked;
                                    }
                                }
                            }
                            render(__data);
                        } catch (_) {
                            el.checked = !checked;
                        }
                    });
                });
            }

            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.stores)) return payload;
                if (
                    payload.structuredContent &&
                    Array.isArray(payload.structuredContent.stores)
                ) {
                    return payload.structuredContent;
                }
                return null;
            }

            initWidget({
                name: "grocery-list-widget",
                loading: "Loading the grocery list…",
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                    if (__data) render(__data);
                },
            });
        </script>
    </body>
</html>
