<!doctype html>
<!--
  Fridge widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  One card (`.panel`): a header, then each location with its items (quantity
  and optional expiry). Data arrives as the `structuredContent` of get_fridge;
  the shared bridge reads it across host conventions and calls render().
  Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Fridge</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            .loc {
                font-size: 12.5px;
                font-weight: 800;
            }
            .item {
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 4px 0;
                font-size: 12.5px;
            }
            .item .name {
                flex: 1 1 auto;
                min-width: 0;
            }
            .qty {
                font-variant-numeric: tabular-nums;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .exp {
                font-size: 10.5px;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .empty-loc {
                font-size: 12px;
                color: var(--text-dim);
                padding: 2px 0 4px;
            }
        </style>
    </head>
    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            const SAMPLE = {
                locale: "en",
                locations: [
                    {
                        id: "loc-1",
                        name: "Fridge",
                        sort_order: 0,
                        items: [
                            {
                                id: "it-1",
                                location_id: "loc-1",
                                kind: "food",
                                display_name: "Milk",
                                amount: 0.5,
                                unit: "l",
                                expires_on: "2026-07-18",
                            },
                            {
                                id: "it-2",
                                location_id: "loc-1",
                                kind: "food",
                                display_name: "Cottage Cheese",
                                amount: 200,
                                unit: "g",
                                expires_on: "2026-07-20",
                            },
                        ],
                    },
                    {
                        id: "loc-2",
                        name: "Pantry",
                        sort_order: 1,
                        items: [
                            {
                                id: "it-3",
                                location_id: "loc-2",
                                kind: "food",
                                display_name: "Oats",
                                amount: 500,
                                unit: "g",
                                expires_on: null,
                            },
                        ],
                    },
                    {
                        id: "loc-3",
                        name: "Freezer",
                        sort_order: 2,
                        items: [],
                    },
                ],
            };

            let __widgetApi = null;

            function esc(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function tpl(template, vars) {
                return String(template).replace(/\{(\w+)\}/g, (_, k) =>
                    vars[k] == null ? "" : String(vars[k]),
                );
            }

            function setLocaleFrom(data, api) {
                setLocale(
                    pickLocale(
                        data && data.locale,
                        api && api.hostContext && api.hostContext.locale,
                    ),
                );
            }

            function render(data) {
                const root = document.getElementById("root");
                if (!data || !Array.isArray(data.locations)) {
                    root.innerHTML = "";
                    return;
                }
                setLocaleFrom(data, __widgetApi);
                const itemCount = (data.locations || []).reduce(
                    (n, loc) => n + ((loc.items && loc.items.length) || 0),
                    0,
                );
                if (!data.locations.length) {
                    root.innerHTML = `
          <div class="panel">
            <div class="phead"><div class="ptitle">${esc(T.fridge.title)}</div></div>
            <div class="empty">${esc(T.fridge.empty)}</div>
          </div>`;
                    return;
                }
                const locs = data.locations
                    .map((loc) => {
                        const items = loc.items || [];
                        const body =
                            items.length === 0
                                ? `<div class="empty-loc">${esc(T.fridge.emptyLocation)}</div>`
                                : items
                                      .map((item) => {
                                          const exp = item.expires_on
                                              ? `<span class="exp">${esc(tpl(T.fridge.expires, { date: item.expires_on }))}</span>`
                                              : "";
                                          return `<div class="item"><span class="name">${esc(item.display_name)}</span><span class="qty">${esc(item.amount)} ${esc(item.unit)}</span>${exp}</div>`;
                                      })
                                      .join("");
                        return `<div class="psec"><div class="loc">${esc(loc.name)}</div>${body}</div>`;
                    })
                    .join("");
                const sub = itemCount === 0 ? esc(T.fridge.empty) : "";
                root.innerHTML = `
          <div class="panel">
            <div class="phead">
              <div class="ptitle">${esc(T.fridge.title)}</div>
              ${sub ? `<div class="pmeta">${sub}</div>` : ""}
            </div>
            ${locs}
          </div>`;
            }

            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.locations)) return payload;
                if (
                    payload.structuredContent &&
                    Array.isArray(payload.structuredContent.locations)
                ) {
                    return payload.structuredContent;
                }
                return null;
            }

            initWidget({
                name: "fridge-widget",
                loading: "Loading the fridge…",
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
