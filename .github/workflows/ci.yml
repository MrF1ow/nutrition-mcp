name: CI

# Runs on every pull request and on every push to main. Railway deploys main,
# so this is the last gate before a change reaches the household's deploy.
#
# The format check keeps the tree prettier-clean, which is what makes
# `bun run format` safe to run: it only ever touches files you actually edited.

on:
    pull_request:
    push:
        branches: ["main"]

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate login templates
              run: bun run gen:all

            - name: Check formatting
              run: bun run format:check

            - name: Typecheck src/
              run: bun run typecheck

            - name: Run tests
              run: bun test
